# ================================================================
# PREFIX SETTINGS (Home Row Ergonomics)
# ================================================================
# Change prefix from Ctrl+b to Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ================================================================
# NAVIGATION & SPLITS (Neovim Muscle Memory)
# ================================================================
# Split panes using v and s (like :vsplit and :split)
# Opens new panes in the same directory as the current one
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Move between panes with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with HJKL (Repeatable: press prefix once, then tap H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Rebind Session List (since we took 's' for splitting)
bind S choose-tree -s

# ================================================================
# PERFORMANCE & GHOSTTY/NEOVIM SYNC
# ================================================================
# Fix colors for Ghostty and Neovim (TrueColor support)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# Enable mouse support (clicking, resizing, scrolling)
set -g mouse on

# No delay for escape key (makes Neovim feel faster)
set -s escape-time 0

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# ================================================================
# UTILITY
# ================================================================
# Reload config with Prefix + r
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Initialize TMUX plugin manager (KEEP THIS AT THE BOTTOM)
run '~/.tmux/plugins/tpm/tpm'
